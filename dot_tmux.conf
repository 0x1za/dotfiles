set -g mouse on
set-option -g focus-events on
set -g set-clipboard on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# ==============================================================================
# STATUS BAR
# ==============================================================================
set -g status-position bottom
set -g status-interval 5
# default tmux look: green bar, black text
set -g status-style "bg=green,fg=black"
set -g status-left-length 30
set -g status-right-length 120
set -g status-left " #S "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold,reverse] #I:#W "

# Spotify (robhurring/tmux-spotify) then CPU and RAM (tmux-plugins/tmux-cpu)
set -g @spotify_playing_icon "▶"
set -g @spotify_paused_icon "❚❚"
set -g @cpu_percentage_format "%3.0f%%"
set -g @ram_percentage_format "%3.0f%%"
set -g status-right "#{music_status} #{artist}: #{track} │ CPU #{cpu_icon} #{cpu_percentage} │ MEM #{ram_icon} #{ram_percentage} │ %H:%M "

# ==============================================================================
# PLUGINS (TPM). prefix + I installs, prefix + U updates.
# ==============================================================================
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "robhurring/tmux-spotify"

# keep this line last
run "~/.tmux/plugins/tpm/tpm"
